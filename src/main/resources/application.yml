server:
  servlet:
    context-path: /api

spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
  application:
    name: dongpo-app

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger
  version: 'v1'
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  model-and-view-allowed: true